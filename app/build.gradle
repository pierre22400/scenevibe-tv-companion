plugins {
    id "com.android.application"
}

def cloudOrigin = providers.environmentVariable("SCENEVIBE_CLOUD_ORIGIN").orElse("").get()
if (cloudOrigin && !(cloudOrigin ==~ /https:\/\/[^\/:?#]+/)) {
    throw new GradleException("SCENEVIBE_CLOUD_ORIGIN must be an exact HTTPS origin on port 443")
}

def enableLanDev = providers.environmentVariable("SCENEVIBE_ENABLE_LAN_DEV").orElse("false").get()
def enableLanDevLiteral = enableLanDev.equalsIgnoreCase("true") ? "true" : "false"

// E5-NATIVE-035: explicit local qualification only. Default/release paths stay OFF and
// the qualified APK cannot contain an operational Cloud origin or LAN control surface.
def e5Choice = providers.environmentVariable("SCENEVIBE_E5_NATIVE_QUALIFICATION").orElse("").get()
if (e5Choice && e5Choice != "e5-native-035") {
    throw new GradleException("Use the exact E5 qualification token or leave it absent")
}
def e5Native = e5Choice == "e5-native-035"
if (e5Native && (cloudOrigin || enableLanDevLiteral == "true")) {
    throw new GradleException("E5 local qualification requires Cloud empty and LAN OFF")
}
if (e5Native && gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }) {
    throw new GradleException("E5 qualification is debug-only")
}

android {
    buildFeatures { buildConfig true }
    namespace "com.scenevibe.tvcompanionpoc"
    compileSdk 35

    defaultConfig {
        applicationId "com.scenevibe.tvcompanionpoc"
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName "0.8.2-tv-release-hardening"
        buildConfigField "String", "CLOUD_ORIGIN", "\"${cloudOrigin}\""
        buildConfigField "boolean", "ENABLE_LAN_DEV", "${enableLanDevLiteral}"
        buildConfigField "boolean", "E5_NATIVE_QUALIFICATION", "false"
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "E5_NATIVE_QUALIFICATION", e5Native ? "true" : "false"
            if (e5Native) versionNameSuffix "-e5-native035"
        }
        // Explicit production RELEASE variant. The POC intentionally keeps minify
        // and resource shrinking OFF so the qualified 0.8.1 runtime behavior stays
        // byte-for-byte unchanged except for the debuggable flag and signing. No
        // signingConfig is embedded here: the real release signature is applied
        // post-build by apksigner in CI using GitHub secrets, so no key material is
        // ever required at Gradle configure time. assembleRelease therefore emits an
        // unsigned, non-debuggable APK (app-release-unsigned.apk).
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions { unitTests.returnDefaultValues = true }
    if (e5Native) {
        defaultConfig.versionCode = 14
        sourceSets.debug.manifest.srcFile "src/e5Qualification/AndroidManifest.xml"
        sourceSets.debug.assets.srcDirs += ["src/e5Qualification/assets"]
        // Keep E5 platform probes out of historical M4/M5 reconstruction builds.
        // They are compiled and executed explicitly by the qualification workflow.
        sourceSets.androidTest.java.srcDirs += ["src/e5QualificationAndroidTest/java"]
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
