plugins {
    id "com.android.application"
}

/**
 * Keep the historical default build intact. The separate observation variant has no
 * Cloud/LAN transport or signing identity; qualification can also make debug unsigned.
 */

def cloudOrigin = providers.environmentVariable("SCENEVIBE_CLOUD_ORIGIN").orElse("").get()
if (cloudOrigin && !(cloudOrigin ==~ /https:\/\/[^\/:?#]+/)) {
    throw new GradleException("SCENEVIBE_CLOUD_ORIGIN must be an exact HTTPS origin on port 443")
}

def enableLanDev = providers.environmentVariable("SCENEVIBE_ENABLE_LAN_DEV").orElse("false").get()
def enableLanDevLiteral = enableLanDev.equalsIgnoreCase("true") ? "true" : "false"

android {
    buildFeatures { buildConfig true }
    namespace "com.scenevibe.tvcompanionpoc"
    compileSdk 35

    defaultConfig {
        // 003-E instrumentation targets only the explicit local qualification variant.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        applicationId "com.scenevibe.tvcompanionpoc"
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName "0.8.2-tv-release-hardening"
        buildConfigField "String", "CLOUD_ORIGIN", "\"${cloudOrigin}\""
        buildConfigField "boolean", "ENABLE_LAN_DEV", "${enableLanDevLiteral}"
        buildConfigField "boolean", "TVFIRST_OBSERVATION_ONLY", "false"
        buildConfigField "boolean", "TVFIRST_DELIVERY_ONLY", "false"
        buildConfigField "boolean", "TVFIRST_TEXT_LOCAL_QUALIFICATION", "false"
        buildConfigField "boolean", "TVFIRST_TEXT_SONY_QUALIFICATION", "false"
        buildConfigField "boolean", "CLOUD_MULTIMEDIA_EXPERIMENTAL", "false"
        buildConfigField "boolean", "CLOUD_MULTIMEDIA_SERVICE", "false"
        buildConfigField "boolean", "ADSYNC_PROTOTYPE", "false"
    }

    buildTypes {
        // Explicit production RELEASE variant. The POC intentionally keeps minify
        // and resource shrinking OFF so the qualified 0.8.1 runtime behavior stays
        // byte-for-byte unchanged except for the debuggable flag and signing. No
        // signingConfig is embedded here: the real release signature is applied
        // post-build by apksigner in CI using GitHub secrets, so no key material is
        // ever required at Gradle configure time. assembleRelease therefore emits an
        // unsigned, non-debuggable APK (app-release-unsigned.apk).
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig null
        }
        observation {
            initWith release
            buildConfigField "boolean", "TVFIRST_OBSERVATION_ONLY", "true"
            buildConfigField "String", "CLOUD_ORIGIN", '""'
            buildConfigField "boolean", "ENABLE_LAN_DEV", "false"
            signingConfig null
        }
        tvfirst008 {
            initWith release
            versionNameSuffix "-tvfirst008-cache-only"
            buildConfigField "boolean", "TVFIRST_OBSERVATION_ONLY", "true"
            buildConfigField "boolean", "TVFIRST_DELIVERY_ONLY", "true"
            buildConfigField "String", "CLOUD_ORIGIN", "\"${cloudOrigin}\""
            buildConfigField "boolean", "ENABLE_LAN_DEV", "false"
            signingConfig null
        }
        // Software-only composition: preserve 008's disabled entry points and permissions.
        tvfirst009 {
            initWith tvfirst008
            versionNameSuffix "-tvfirst009-local-text-software"
            buildConfigField "boolean", "TVFIRST_TEXT_LOCAL_QUALIFICATION", "true"
            buildConfigField "String", "CLOUD_ORIGIN", '""'
            signingConfig null
        }
        // Explicit user-started TEXT qualification; 008 and historical profiles stay closed to this entry.
        tvfirst009sony {
            initWith tvfirst008
            versionNameSuffix "-tvfirst009-text-qualification"
            buildConfigField "boolean", "TVFIRST_TEXT_LOCAL_QUALIFICATION", "true"
            buildConfigField "boolean", "TVFIRST_TEXT_SONY_QUALIFICATION", "true"
            signingConfig null
        }
        // Local file qualification only. Stable package, Cloud, boot and overlay stay isolated.
        studiomultimedia001 {
            initWith debug
            applicationIdSuffix ".studiomultimedia001"
            versionNameSuffix "-studio-multimedia001-local"
            buildConfigField "String", "CLOUD_ORIGIN", '""'
            buildConfigField "boolean", "ENABLE_LAN_DEV", "false"
            buildConfigField "boolean", "TVFIRST_DELIVERY_ONLY", "true"
            signingConfig signingConfigs.debug
        }
        // Distinct unsigned v15 candidate; the qualified v14 variant remains unchanged.
        tvfirst013sony {
            initWith tvfirst009sony
            versionNameSuffix "-tvfirst013-text-diagnostics"
            signingConfig null
        }
        // Same Companion and launcher. Only this experimental build exposes multimedia delivery.
        cloudandroid001 {
            initWith tvfirst013sony
            versionNameSuffix "-cloud-android-tv001"
            buildConfigField "boolean", "CLOUD_MULTIMEDIA_EXPERIMENTAL", "true"
            signingConfig null
        }
    }

    buildTypes.create("cloudandroid002") {
        initWith buildTypes.cloudandroid001
        versionNameSuffix "-cloud-android-tv002"
        buildConfigField "boolean", "CLOUD_MULTIMEDIA_SERVICE", "true"
        signingConfig null
    }
    // Same Companion, ports and private cache; only this experimental v18 opts in to AD-SYNC controls.
    buildTypes.create("adsync001") {
        initWith buildTypes.cloudandroid002
        versionNameSuffix "-ad-sync001"
        buildConfigField "boolean", "ADSYNC_PROTOTYPE", "true"
        signingConfig null
    }
    sourceSets.adsync001 {
        java.srcDir "src/tvfirst008/java"
        res.srcDir "src/tvfirst008/res"
        manifest.srcFile "src/tvfirst009sony/AndroidManifest.xml"
    }
    sourceSets.studiomultimedia001.java.srcDir "src/release/java"
    sourceSets.cloudandroid002 {
        java.srcDir "src/tvfirst008/java"
        res.srcDir "src/tvfirst008/res"
        manifest.srcFile "src/tvfirst009sony/AndroidManifest.xml"
    }
    sourceSets.cloudandroid001 {
        java.srcDir "src/tvfirst008/java"
        res.srcDir "src/tvfirst008/res"
        manifest.srcFile "src/tvfirst009sony/AndroidManifest.xml"
    }
    sourceSets.testStudiomultimedia001.java.srcDir "../qualification/studiomultimedia001/oracle"
    sourceSets.tvfirst013sony {
        java.srcDir "src/tvfirst008/java"
        res.srcDir "src/tvfirst008/res"
    }
    sourceSets.observation.java.srcDir "src/release/java"
    sourceSets.tvfirst009 {
        java.srcDir "src/tvfirst008/java"
        res.srcDir "src/tvfirst008/res"
        manifest.srcFile "src/tvfirst008/AndroidManifest.xml"
    }
    sourceSets.tvfirst009sony {
        java.srcDir "src/tvfirst008/java"
        res.srcDir "src/tvfirst008/res"
    }

    // An explicit qualification-only property prevents even disposable debug signing.
    if (providers.gradleProperty("scenevibeQualificationUnsigned").orElse("false").get() == "true") {
        buildTypes.configureEach { signingConfig null }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
        // Actual Android View/lifecycle qualification, without changing production dependencies.
        unitTests.includeAndroidResources = true
        // Historical HTTPS fixtures install a JVM-global URLStreamHandlerFactory.
        // A fresh fork per class keeps real Android resource loading independent.
        unitTests.all {
            forkEvery = 1
            if (providers.gradleProperty("scenevibe009Fixture").isPresent()) {
                systemProperty "scenevibe009.fixture", providers.gradleProperty("scenevibe009Fixture").get()
            }
            if (name.toLowerCase().contains("studiomultimedia001")) {
                systemProperty "scenevibe.multimedia.package", providers.gradleProperty("scenevibeMultimediaPackage").orElse("").get()
                systemProperty "scenevibe.multimedia.replacement", providers.gradleProperty("scenevibeMultimediaReplacement").orElse("").get()
            }
        }
    }
    // Native fixtures require the matching application variant and external test assets.
    // Select their source families before compilation, rather than compiling every
    // historical and Cloud fixture into an unrelated instrumentation APK.
    sourceSets.androidTest.java {
        if (providers.gradleProperty("scenevibeAdSyncNativeQualification").orElse("false").get() == "true") {
            srcDir "src/test/java"
            setIncludes(["**/AdSyncAndroidTest.java", "**/AdSyncTestFixture.java"])
        } else if (providers.gradleProperty("scenevibe003eNativeQualification").orElse("false").get() == "true") {
            setIncludes(["**/CloudBridge003e*.java", "**/Native003eFixture.java"])
        } else if (providers.gradleProperty("scenevibeCloudAndroidNativeQualification").orElse("false").get() == "true") {
            setIncludes(["**/CloudAndroid001*.java"])
        } else if (providers.gradleProperty("scenevibeCloudAndroid002NativeQualification").orElse("false").get() == "true") {
            setIncludes(["**/CloudAndroid002*.java"])
        } else {
            // M4/M5 init scripts inject only their own platform-native runners.
            setSrcDirs([])
        }
    }
    if (providers.gradleProperty("scenevibeAdSyncNativeQualification").orElse("false").get() == "true") {
        testBuildType "adsync001"
        buildTypes.adsync001 {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }
    if (providers.gradleProperty("scenevibe003eNativeQualification").orElse("false").get() == "true") {
        testBuildType "studiomultimedia001"
    }
    if (providers.gradleProperty("scenevibeCloudAndroidNativeQualification").orElse("false").get() == "true") {
        testBuildType "cloudandroid001"
        buildTypes.cloudandroid001 {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }
    if (providers.gradleProperty("scenevibeCloudAndroid002NativeQualification").orElse("false").get() == "true") {
        testBuildType "cloudandroid002"
        buildTypes.cloudandroid002 {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType("adsync001")) { variant ->
        variant.outputs.each { output -> output.versionCode.set(18) }
    }
    onVariants(selector().withBuildType("cloudandroid002")) { variant ->
        variant.outputs.each { output -> output.versionCode.set(17) }
    }
    onVariants(selector().withBuildType("cloudandroid001")) { variant ->
        variant.outputs.each { output -> output.versionCode.set(16) }
    }
    onVariants(selector().withBuildType("studiomultimedia001")) { variant ->
        variant.outputs.each { output -> output.versionCode.set(1) }
    }
    onVariants(selector().withBuildType("tvfirst008")) { variant ->
        variant.outputs.each { output -> output.versionCode.set(13) }
    }
    onVariants(selector().withBuildType("tvfirst009sony")) { variant ->
        variant.outputs.each { output -> output.versionCode.set(14) }
    }
    onVariants(selector().withBuildType("tvfirst013sony")) { variant ->
        variant.outputs.each { output -> output.versionCode.set(15) }
    }
}

dependencies {
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    testImplementation "org.robolectric:robolectric:4.14.1"
}
