plugins {
    id "com.android.application"
}

/**
 * Keep the historical default build intact. The separate observation variant has no
 * Cloud/LAN transport or signing identity; qualification can also make debug unsigned.
 */

def cloudOrigin = providers.environmentVariable("SCENEVIBE_CLOUD_ORIGIN").orElse("").get()
if (cloudOrigin && !(cloudOrigin ==~ /https:\/\/[^\/:?#]+/)) {
    throw new GradleException("SCENEVIBE_CLOUD_ORIGIN must be an exact HTTPS origin on port 443")
}

def enableLanDev = providers.environmentVariable("SCENEVIBE_ENABLE_LAN_DEV").orElse("false").get()
def enableLanDevLiteral = enableLanDev.equalsIgnoreCase("true") ? "true" : "false"

android {
    buildFeatures { buildConfig true }
    namespace "com.scenevibe.tvcompanionpoc"
    compileSdk 35

    defaultConfig {
        applicationId "com.scenevibe.tvcompanionpoc"
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName "0.8.2-tv-release-hardening"
        buildConfigField "String", "CLOUD_ORIGIN", "\"${cloudOrigin}\""
        buildConfigField "boolean", "ENABLE_LAN_DEV", "${enableLanDevLiteral}"
        buildConfigField "boolean", "TVFIRST_OBSERVATION_ONLY", "false"
    }

    buildTypes {
        // Explicit production RELEASE variant. The POC intentionally keeps minify
        // and resource shrinking OFF so the qualified 0.8.1 runtime behavior stays
        // byte-for-byte unchanged except for the debuggable flag and signing. No
        // signingConfig is embedded here: the real release signature is applied
        // post-build by apksigner in CI using GitHub secrets, so no key material is
        // ever required at Gradle configure time. assembleRelease therefore emits an
        // unsigned, non-debuggable APK (app-release-unsigned.apk).
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig null
        }
        observation {
            initWith release
            buildConfigField "boolean", "TVFIRST_OBSERVATION_ONLY", "true"
            buildConfigField "String", "CLOUD_ORIGIN", '""'
            buildConfigField "boolean", "ENABLE_LAN_DEV", "false"
            signingConfig null
        }
        // AUDIO 002 EXPERIMENTAL, LOCAL dev + SOFTWARE qualification only (mandate §15).
        // A DISTINCT applicationId (via applicationIdSuffix) so this experimental APK
        // installs ALONGSIDE the stable package without clobbering its data/pairing:
        // stable  = com.scenevibe.tvcompanionpoc
        // audioexp = com.scenevibe.tvcompanionpoc.audioexp
        // It is debuggable and uses the DISPOSABLE default debug signing only; it NEVER
        // references the M5 release keystore (no signingConfig assigned here). The stable
        // applicationId and versionCode (12 on this branch; never bumped to interfere with
        // the stable 15) are untouched. Do NOT run a signed/release build with this type.
        audioexp {
            initWith debug
            applicationIdSuffix ".audioexp"
            versionNameSuffix "-audio002-exp"
            debuggable true
            minifyEnabled false
            shrinkResources false
            // Disposable debug signing only: inherit the default debug SigningConfig that
            // AGP auto-provisions for debuggable builds. Explicitly NOT the M5 keystore.
            signingConfig signingConfigs.debug
        }
    }

    sourceSets.observation.java.srcDir "src/release/java"
    // initWith copies build settings, not source directories. Reuse the existing
    // development provider and its Android lifecycle/view tests for audioexp only.
    sourceSets.audioexp.java.srcDir "src/debug/java"
    sourceSets.testAudioexp.java.srcDir "src/testDebug/java"

    // An explicit qualification-only property prevents even disposable debug signing.
    if (providers.gradleProperty("scenevibeQualificationUnsigned").orElse("false").get() == "true") {
        buildTypes.configureEach { signingConfig null }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
        // Actual Android View/lifecycle qualification, without changing production dependencies.
        unitTests.includeAndroidResources = true
        // Historical HTTPS fixtures install a JVM-global URLStreamHandlerFactory.
        // A fresh fork per class keeps real Android resource loading independent.
        unitTests.all { forkEvery = 1 }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    testImplementation "org.robolectric:robolectric:4.14.1"
}
