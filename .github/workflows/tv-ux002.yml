name: AD-DETECTION 001 passive public evidence and v24 regression

# No provider calls, deployment, platform modification or physical device access.
on:
  push:
    branches: [work/scenevibe-ad-detection-001]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SCENEVIBE_CLOUD_ORIGIN: https://scenevibe-cloud-tv002-staging-archc-ode.vercel.app
      SIGNING_ENABLED: ${{ github.ref == 'refs/heads/work/scenevibe-ad-detection-001' && secrets.SCENEVIBE_ANDROID_KEYSTORE_BASE64 != '' && secrets.SCENEVIBE_ANDROID_KEYSTORE_PASSWORD != '' && secrets.SCENEVIBE_ANDROID_KEY_ALIAS != '' && secrets.SCENEVIBE_ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Deterministic guard and actual shared runtime
        env:
          SCENEVIBE_CLOUD_ORIGIN: ''
        run: gradle --no-daemon --max-workers=2 testDebugUnitTest --tests '*AdSyncControllerTest' --tests '*AdSyncRuntimeTest' --tests '*AdSyncFreshCaptureTest' --tests '*DeveloperOverlayStateTest' --tests '*AdSyncRecoveryTest' --tests '*DeveloperFocusStateTest' --tests '*LocalDeveloperServerTest' --tests '*Runtime003*' --tests '*Runtime004*' --tests '*AdEvidenceDetectorTest' --tests '*AdObservationPrivacyTest'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact phone page in Chromium and actual HTTP listener
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/runtime003-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/runtime003-browser/node_modules/.bin/playwright" install --with-deps chromium
          json_jar="$(find "${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1/org.json/json/20240303" -type f -name json-20240303.jar -print -quit)"
          test -n "$json_jar"
          mkdir -p "$RUNNER_TEMP/runtime003-classes" tv-runtime003-browser
          javac -cp "$json_jar" -d "$RUNNER_TEMP/runtime003-classes" app/src/main/java/com/scenevibe/tvcompanionpoc/LocalDeveloperServer.java qualification/tv-runtime003/LocalBrowserFixture.java
          NODE_PATH="$RUNNER_TEMP/runtime003-browser/node_modules" node qualification/tv-runtime003/browser.cjs "$RUNNER_TEMP/runtime003-browser-info.json" "$RUNNER_TEMP/runtime003-classes:$json_jar" app/src/tvux002/assets/local-controls tv-runtime003-browser/result.json
      - name: Control windows and application modals under Robolectric
        env:
          SCENEVIBE_CLOUD_ORIGIN: ''
        run: gradle --no-daemon --max-workers=2 testTvux002UnitTest --tests '*DeveloperPanelTest'
      - name: Compile and lint experimental v25 plus retained v19/v18/v17
        run: gradle --no-daemon --max-workers=2 assembleTvux002 lintTvux002 assembleTvux001 assembleAdsync001 assembleCloudandroid002
      - name: Sign candidate with the existing M5 key when present
        if: env.SIGNING_ENABLED == 'true'
        env:
          SCENEVIBE_ANDROID_KEYSTORE_BASE64: ${{ secrets.SCENEVIBE_ANDROID_KEYSTORE_BASE64 }}
          SCENEVIBE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SCENEVIBE_ANDROID_KEYSTORE_PASSWORD }}
          SCENEVIBE_ANDROID_KEY_ALIAS: ${{ secrets.SCENEVIBE_ANDROID_KEY_ALIAS }}
          SCENEVIBE_ANDROID_KEY_PASSWORD: ${{ secrets.SCENEVIBE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p tv-ux002-signed
          printf '%s' "$SCENEVIBE_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tvux-stable.jks"
          tools="$ANDROID_HOME/build-tools/34.0.0"
          "$tools/aapt" dump badging app/build/outputs/apk/tvux002/app-tvux002-unsigned.apk > tv-ux002-signed/apk-badging.txt
          if grep -q application-debuggable tv-ux002-signed/apk-badging.txt; then exit 1; fi
          "$tools/zipalign" -f 4 app/build/outputs/apk/tvux002/app-tvux002-unsigned.apk "$RUNNER_TEMP/tvux-aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/tvux-stable.jks" --ks-pass env:SCENEVIBE_ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$SCENEVIBE_ANDROID_KEY_ALIAS" --key-pass env:SCENEVIBE_ANDROID_KEY_PASSWORD --out tv-ux002-signed/scenevibe-ad-detection001-stable.apk "$RUNNER_TEMP/tvux-aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs tv-ux002-signed/scenevibe-ad-detection001-stable.apk > tv-ux002-signed/apksigner-verify.txt
          sha256sum tv-ux002-signed/scenevibe-ad-detection001-stable.apk > tv-ux002-signed/sha256.txt
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/tvux-stable.jks" "$RUNNER_TEMP/tvux-aligned.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scenevibe-tv-ux002-${{ github.run_id }}
          path: |
            tv-ux002-signed/
            tv-runtime003-browser/
            app/build/outputs/apk/tvux002/*unsigned.apk
            app/build/test-results/**/*.xml
            app/build/reports/lint-results-tvux002.*
          if-no-files-found: error
          retention-days: 14
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCENEVIBE_CLOUD_ORIGIN: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile isolated native fixtures with no Cloud origin
        run: gradle --no-daemon --max-workers=2 -PscenevibeTvUx002NativeQualification=true assembleTvux002 assembleTvux002AndroidTest
      - name: Owned emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android TV local fixture, never Prime or Sony
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          profile: tv_1080p
          arch: x86
          disk-size: 2048M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048 -cores 2
          script: bash .github/scripts/tv-ux002-native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scenevibe-tv-ux002-native-${{ github.run_id }}
          path: tv-ux002-native/
          if-no-files-found: error
          retention-days: 14
