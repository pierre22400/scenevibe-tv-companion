name: Mediaexperiment POC APK

on:
  push:
    branches:
      - experiment/scenevibe-media-interlude-poc-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build isolated mediaexperiment APK
        run: gradle :mediaexperiment:testDebugUnitTest :mediaexperiment:assembleDebug --stacktrace
      - name: Verify APK identity and digest
        run: |
          APK="mediaexperiment/build/outputs/apk/debug/mediaexperiment-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 3
          sha256sum "$APK"
      - name: Upload mediaexperiment APK
        uses: actions/upload-artifact@v4
        with:
          name: scenevibe-media-interlude-poc-cue-fr
          path: mediaexperiment/build/outputs/apk/debug/mediaexperiment-debug.apk
          if-no-files-found: error
          retention-days: 7
