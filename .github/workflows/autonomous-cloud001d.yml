name: Companion autonomous and integration qualification

# Default jobs use local fixtures only. The real HTTPS job is opt-in and remains NOT EXECUTED while provider writes are blocked.
on:
  push:
    branches: [work/scenevibe-autonomous-cloud-tv-001d, work/scenevibe-companion-integration-001]
    paths-ignore: ["docs/**"]
  workflow_dispatch:
    inputs:
      run_hosted_https:
        description: "Run provider-writing HTTPS Android qualification only after explicit owner GO and synthetic Track seeding"
        type: boolean
        default: false
concurrency:
  group: cloud001d-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
env:
  ORG_GRADLE_PROJECT_scenevibeCompanionIntegration001: ${{ github.ref == 'refs/heads/work/scenevibe-companion-integration-001' && 'true' || 'false' }}
  ORG_GRADLE_PROJECT_scenevibeRealTrack001: "true"
  ORG_GRADLE_PROJECT_scenevibePublicAutonomous001b: "true"
  ORG_GRADLE_PROJECT_scenevibeAutonomousHosted001d: "true"
jobs:
  windows_capture:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actual Windows PowerShell 5 and 7 with owned fake ADB, never a device
        shell: cmd
        run: |
          mkdir multi-observation-windows
          set SCENEVIBE_TEST_POWERSHELL=powershell.exe
          python -B -m unittest discover -s qualification/multiplatform001 -p test_*.py -v > multi-observation-windows/powershell5.log 2>&1
          if errorlevel 1 exit /b 1
          set SCENEVIBE_TEST_POWERSHELL=pwsh.exe
          python -B -m unittest discover -s qualification/multiplatform001 -p test_*.py -v > multi-observation-windows/powershell7.log 2>&1
          if errorlevel 1 exit /b 1
          type multi-observation-windows\powershell5.log
          type multi-observation-windows\powershell7.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scenevibe-multiplatform-windows-${{ github.run_id }}
          path: multi-observation-windows/
          if-no-files-found: error
          retention-days: 14
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      # Pin this REAL TRACK TV candidate to the already qualified G6-G9 Preview,
      # not the generic staging alias (currently routed to Cloud Android TV002).
      SCENEVIBE_CLOUD_ORIGIN: https://scenevibe-autonomous001d-qual-preview.vercel.app
      SIGNING_ENABLED: ${{ github.repository == 'pierre22400/scenevibe-tv-companion' && (github.ref == 'refs/heads/work/scenevibe-autonomous-cloud-tv-001d' || github.ref == 'refs/heads/work/scenevibe-companion-integration-001') && secrets.SCENEVIBE_ANDROID_KEYSTORE_BASE64 != '' && secrets.SCENEVIBE_ANDROID_KEYSTORE_PASSWORD != '' && secrets.SCENEVIBE_ANDROID_KEY_ALIAS != '' && secrets.SCENEVIBE_ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Require historical M5 signing for the integrated candidate
        if: env.ORG_GRADLE_PROJECT_scenevibeCompanionIntegration001 == 'true'
        run: test "$SIGNING_ENABLED" = true
      - name: Python POC boundary
        run: python3 -B -m unittest tests.test_poc_contract
      - name: Deterministic guard and actual shared runtime
        env:
          SCENEVIBE_CLOUD_ORIGIN: ''
        run: gradle --no-daemon --max-workers=2 testDebugUnitTest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact phone page in Chromium and actual HTTP listener
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/runtime003-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/runtime003-browser/node_modules/.bin/playwright" install --with-deps chromium
          json_jar="$(find "${GRADLE_USER_HOME:-$HOME/.gradle}/caches/modules-2/files-2.1/org.json/json/20240303" -type f -name json-20240303.jar -print -quit)"
          test -n "$json_jar"
          mkdir -p "$RUNNER_TEMP/runtime003-classes" tv-runtime003-browser
          javac -cp "$json_jar" -d "$RUNNER_TEMP/runtime003-classes" app/src/main/java/com/scenevibe/tvcompanionpoc/LocalDeveloperServer.java qualification/tv-runtime003/LocalBrowserFixture.java
          NODE_PATH="$RUNNER_TEMP/runtime003-browser/node_modules" node qualification/tv-runtime003/browser.cjs "$RUNNER_TEMP/runtime003-browser-info.json" "$RUNNER_TEMP/runtime003-classes:$json_jar" app/src/tvux002/assets/local-controls tv-runtime003-browser/result.json
      - name: Read-only Windows capture and offline analysis against synthetic local ADB
        run: |
          set -euo pipefail
          mkdir -p multi-observation-tools
          python3 -B -m unittest discover -s qualification/multiplatform001 -p 'test_*.py' -v 2>&1 | tee multi-observation-tools/tests.log
      - name: Control windows and application modals under Robolectric
        env:
          SCENEVIBE_CLOUD_ORIGIN: ''
        run: |
          gradle --no-daemon --max-workers=2 testTvux002UnitTest --tests '*DeveloperPanelTest'
          if [[ "$ORG_GRADLE_PROJECT_scenevibeCompanionIntegration001" == true ]]; then
            gradle --no-daemon --max-workers=2 testTvux002UnitTest --tests '*CompanionRecalibrationPanelTest'
          fi
      - name: G11 isolated account and catalogue routing guards
        run: python3 -B -m unittest discover -s qualification/real-track001 -p 'test_g11_ui_guard.py' -v
      - name: Compile signed-upgrade instrumentation against the existing native fixture
        if: env.ORG_GRADLE_PROJECT_scenevibeCompanionIntegration001 == 'true'
        env:
          SCENEVIBE_CLOUD_ORIGIN: ''
        run: gradle --no-daemon --max-workers=2 -PscenevibeTvUx002NativeQualification=true assembleTvux002AndroidTest
      - name: Download the exact signed physically qualified v31 baseline
        if: env.ORG_GRADLE_PROJECT_scenevibeCompanionIntegration001 == 'true'
        uses: actions/download-artifact@v4
        with:
          name: scenevibe-real-track001-42480014146
          run-id: 42480014146
          github-token: ${{ github.token }}
          path: baseline
      - name: Compile and lint candidate plus retained v19/v18/v17
        run: gradle --no-daemon --max-workers=2 assembleTvux002 lintTvux002 assembleTvux001 assembleAdsync001 assembleCloudandroid002
      - name: Compare real merged v31 and candidate permissions
        if: env.ORG_GRADLE_PROJECT_scenevibeCompanionIntegration001 == 'true'
        run: |
          mkdir -p tv-ux002-signed
          echo '98ac6b74f71f02cbb52bd09998565012c864ec61aeb0a094d610de614283710f  baseline/tv-ux002-signed/scenevibe-real-track001-v31-stable.apk' | sha256sum -c -
          python3 qualification/companion-integration001/permissions.py "$ANDROID_HOME/build-tools/34.0.0/aapt" baseline/tv-ux002-signed/scenevibe-real-track001-v31-stable.apk app/build/outputs/apk/tvux002/app-tvux002-unsigned.apk tv-ux002-signed/permission-comparison.json
      - name: Sign candidate with the existing M5 key when present
        if: env.SIGNING_ENABLED == 'true'
        env:
          SCENEVIBE_ANDROID_KEYSTORE_BASE64: ${{ secrets.SCENEVIBE_ANDROID_KEYSTORE_BASE64 }}
          SCENEVIBE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SCENEVIBE_ANDROID_KEYSTORE_PASSWORD }}
          SCENEVIBE_ANDROID_KEY_ALIAS: ${{ secrets.SCENEVIBE_ANDROID_KEY_ALIAS }}
          SCENEVIBE_ANDROID_KEY_PASSWORD: ${{ secrets.SCENEVIBE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p tv-ux002-signed
          printf '%s' "$SCENEVIBE_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tvux-stable.jks"
          tools="$ANDROID_HOME/build-tools/34.0.0"
          "$tools/aapt" dump badging app/build/outputs/apk/tvux002/app-tvux002-unsigned.apk > tv-ux002-signed/apk-badging.txt
          if grep -q application-debuggable tv-ux002-signed/apk-badging.txt; then exit 1; fi
          scenevibe_version=33
          scenevibe_suffix=autonomous-cloud001d-v33
          scenevibe_apk=scenevibe-autonomous-cloud001d-v33-signed.apk
          if [[ "$ORG_GRADLE_PROJECT_scenevibeCompanionIntegration001" == true ]]; then
            scenevibe_version=32
            scenevibe_suffix=companion-integration001-v32
            scenevibe_apk=scenevibe-companion-integration001-v32-signed.apk
          fi
          grep -q "package: name='com.scenevibe.tvcompanionpoc' versionCode='$scenevibe_version'" tv-ux002-signed/apk-badging.txt
          grep -q "$scenevibe_suffix" tv-ux002-signed/apk-badging.txt
          git rev-parse HEAD > tv-ux002-signed/source-commit.txt
          "$tools/zipalign" -f 4 app/build/outputs/apk/tvux002/app-tvux002-unsigned.apk "$RUNNER_TEMP/tvux-aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/tvux-stable.jks" --ks-pass env:SCENEVIBE_ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$SCENEVIBE_ANDROID_KEY_ALIAS" --key-pass env:SCENEVIBE_ANDROID_KEY_PASSWORD --out "tv-ux002-signed/$scenevibe_apk" "$RUNNER_TEMP/tvux-aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "tv-ux002-signed/$scenevibe_apk" > tv-ux002-signed/apksigner-verify.txt
          grep -q 'f908bf564ed97ba67e02b1ebc89eb0239cf980752587f55eb9ec0419791a2e9c' tv-ux002-signed/apksigner-verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' tv-ux002-signed/apksigner-verify.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' tv-ux002-signed/apksigner-verify.txt
          sha256sum "tv-ux002-signed/$scenevibe_apk" > tv-ux002-signed/sha256.txt
          if [[ "$ORG_GRADLE_PROJECT_scenevibeCompanionIntegration001" == true ]]; then
            "$tools/zipalign" -f 4 app/build/outputs/apk/androidTest/tvux002/app-tvux002-androidTest.apk "$RUNNER_TEMP/integration-tests-aligned.apk"
            "$tools/apksigner" sign --ks "$RUNNER_TEMP/tvux-stable.jks" --ks-pass env:SCENEVIBE_ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$SCENEVIBE_ANDROID_KEY_ALIAS" --key-pass env:SCENEVIBE_ANDROID_KEY_PASSWORD --out tv-ux002-signed/companion-integration001-tests-m5.apk "$RUNNER_TEMP/integration-tests-aligned.apk"
            "$tools/apksigner" verify --verbose --print-certs tv-ux002-signed/companion-integration001-tests-m5.apk > tv-ux002-signed/test-apksigner-verify.txt
          fi
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/tvux-stable.jks" "$RUNNER_TEMP/tvux-aligned.apk" "$RUNNER_TEMP/integration-tests-aligned.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scenevibe-autonomous-cloud001d-${{ github.run_id }}
          path: |
            tv-ux002-signed/
            tv-runtime003-browser/
            app/build/outputs/apk/tvux002/*unsigned.apk
            app/build/test-results/**/*.xml
            app/build/reports/ad002/*.json
            app/build/reports/lint-results-tvux002.*
            multi-observation-tools/
          if-no-files-found: error
          retention-days: 14
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCENEVIBE_CLOUD_ORIGIN: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile isolated native fixtures with no Cloud origin
        run: gradle --no-daemon --max-workers=2 -PscenevibeTvUx002NativeQualification=true assembleTvux002 assembleTvux002AndroidTest
      - name: Owned emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android TV local fixture, never Prime or Sony
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          profile: tv_1080p
          arch: x86
          disk-size: 2048M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048 -cores 2
          script: bash .github/scripts/public-autonomous001b-native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scenevibe-autonomous-cloud001d-native-${{ github.run_id }}
          path: |
            tv-ux002-native/
            public001b-native/
          if-no-files-found: error
          retention-days: 14

  native_retained:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCENEVIBE_CLOUD_ORIGIN: ''
      ORG_GRADLE_PROJECT_scenevibeCompanionIntegration001: 'false'
      ORG_GRADLE_PROJECT_scenevibePublicAutonomous001b: 'false'
      ORG_GRADLE_PROJECT_scenevibeAutonomousHosted001d: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile isolated native fixtures with no Cloud origin
        run: gradle --no-daemon --max-workers=2 -PscenevibeTvUx002NativeQualification=true assembleTvux002 assembleTvux002AndroidTest
      - name: Owned emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android TV local fixture, never Prime or Sony
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          profile: tv_1080p
          arch: x86
          disk-size: 2048M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048 -cores 2
          script: bash .github/scripts/real-track001-native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scenevibe-private-v31-retained-${{ github.run_id }}
          path: |
            tv-ux002-native/
            public001b-native/
          if-no-files-found: error
          retention-days: 14

  native_https:
    if: ${{ github.ref == 'refs/heads/work/scenevibe-companion-integration-001' || (github.event_name == 'workflow_dispatch' && inputs.run_hosted_https) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCENEVIBE_CLOUD_ORIGIN: https://scenevibe-autonomous001d-qual-preview.vercel.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile isolated native fixtures with no Cloud origin
        run: gradle --no-daemon --max-workers=2 -PscenevibeTvUx002NativeQualification=true assembleTvux002 assembleTvux002AndroidTest
      - name: Owned emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real HTTPS to owned Android emulator, never Sony or Prime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          profile: tv_1080p
          arch: x86
          disk-size: 2048M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048 -cores 2
          script: bash .github/scripts/autonomous-cloud001d-https-native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scenevibe-autonomous-cloud001d-https-${{ github.run_id }}
          path: |
            public001d-https/
          if-no-files-found: error
          retention-days: 14

  signed_upgrade:
    if: github.ref == 'refs/heads/work/scenevibe-companion-integration-001'
    needs: software
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: scenevibe-real-track001-42480014146
          run-id: 42480014146
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: scenevibe-autonomous-cloud001d-${{ github.run_id }}
          path: signed
      - name: Owned emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual signed M5 v31 to v32 update, no permission grants after update
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          profile: tv_1080p
          arch: x86
          disk-size: 2048M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048 -cores 2
          script: bash .github/scripts/companion-integration001-upgrade.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scenevibe-integration001-signed-upgrade-${{ github.run_id }}
          path: integration001-upgrade/
          if-no-files-found: error
          retention-days: 14
