name: Android debug APK

on:
  push:
    branches: [main, work/tv-pairing-authenticated-lan-001, work/tv-cloud-client-001]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check POC boundary
        run: python3 -m unittest discover -s tests
      - name: Build and lint debug APK (Cloud not configured)
        run: gradle :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --stacktrace
      - name: Build Cloud qualification APK
        env:
          # Stable public SceneVibe origin (NOT a secret): compiles the uploaded APK
          # against the real Cloud endpoint so it is usable for physical qualification.
          SCENEVIBE_CLOUD_ORIGIN: https://interface-scenevibe-3wxg.vercel.app
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: scenevibe-tv-companion-cloud-qualification-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
