name: Android debug APK

# Current integration CI replaces the exact-tree TV-FIRST 003/006 publication
# router. Those sealed gates remain on their original trees; directory presence
# cannot identify the scope of a cumulative PR or main.
on:
  push:
    branches:
      - main
      - work/tv-pairing-authenticated-lan-001
      - work/tv-cloud-client-001
      - kiro/tv-product-hardening-001
  pull_request:
    branches: [main, work/scenevibe-multiplatform-ad-observation-001]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SCENEVIBE_CLOUD_ORIGIN: ''
      SCENEVIBE_ENABLE_LAN_DEV: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Current permission, component, passive MEDIA and transport boundaries
        # Other test_m4*/test_m5* Python modules compare exact historical file
        # inventories/reversible patches, rather than the current application.
        # Current security predicates stay here; M4/M5 runtime is characterized
        # by all JVM tests below and by the native differential/durability jobs.
        run: python3 -B -m unittest discover -s tests -p test_poc_contract.py -v
      - name: Build, lint and run the full current JVM regression suite
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease :app:testDebugUnitTest --stacktrace
      - name: Retained M4/M5 suites, frozen fixtures and raw differential evidence
        run: python3 -B .github/scripts/m4-phase-a-test-summary.py
      - name: Build the LAN developer variant
        env:
          SCENEVIBE_ENABLE_LAN_DEV: 'true'
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenevibe-current-jvm-${{ github.run_id }}
          path: |
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/m4-phase-a-summary.json
            app/build/reports/lint-results-*.xml
          if-no-files-found: error
          retention-days: 14
