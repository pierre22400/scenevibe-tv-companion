name: TV-FIRST 003 exact delivery software qualification

# Called only after the exact source authorization in android-debug.yml.
# No workflow_dispatch, deployment, signing, device access or APK upload here.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  software:
    name: TV-FIRST retained Python + current JVM + release closure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SCENEVIBE_CLOUD_ORIGIN: ""
      SCENEVIBE_ENABLE_LAN_DEV: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - name: Positive and negative authorization controls (temporary clones)
        run: python3 -B qualification/tvfirst003/test_gate.py -v
      - name: Retained Python, current builds/JVM/lint and release fixture closure
        run: python3 -B qualification/tvfirst003/run.py all
      - name: Upload qualification reports only (no APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenevibe-tvfirst003-software-${{ github.run_id }}
          path: |
            build/tvfirst003/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/test-results/testReleaseUnitTest/TEST-*.xml
          if-no-files-found: error
          retention-days: 30
