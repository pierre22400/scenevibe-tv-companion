# Android 15 / API 35 emulator smoke test.
#
# PURPOSE AND HONEST SCOPE
# ------------------------------------------------------------------------------------------
# SceneVibe TV Companion ALREADY compiles and targets compileSdk/targetSdk 35, so this is NOT
# an API-35 migration. The FEAT-004 Android 15 behavior-change audit (recorded in the task
# plan) concluded that ZERO app code or manifest changes are required for Android 15:
#   * the foreground service is foregroundServiceType=specialUse, which is NOT in Android 15's
#     list of BOOT_COMPLETED-restricted FGS types (dataSync, camera, mediaPlayback, phoneCall,
#     mediaProjection, microphone), so the boot-prepare startForegroundService path remains
#     PERMITTED on API 35;
#   * the SYSTEM_ALERT_WINDOW background-FGS narrowing does not apply because the FGS is always
#     started from the foreground (a user Activity action in MainActivity, guarded by
#     Settings.canDrawOverlays) or from the BOOT_COMPLETED exemption path, never from a plain
#     background start that would need an already-visible overlay window;
#   * PendingIntent already uses FLAG_IMMUTABLE.
# This workflow exists to give that audit an automated, repeatable, Android-15 runtime check.
#
# !!! HONESTY / SCOPE LIMITATION — READ BEFORE TRUSTING ANY RESULT !!!
# This job boots a STANDARD Android 15 (API 35) emulator image (google_apis x86_64). At the
# time this workflow was written there is NO officially published, usable Android TV (leanback)
# system image for API 35 in the SDK repository (`system-images;android-35;android-tv;*` does
# not resolve), so a true Android TV emulator cannot be booted here. Consequently:
#   * This job qualifies ANDROID 15 (API 35) PLATFORM INVARIANTS ONLY.
#   * It is NOT, and must never be described as, an "Android TV" or "physical Android TV
#     qualification". Android-TV-specific behavior (leanback launcher placement, D-pad focus,
#     real overlay rendering on a TV surface, real MediaSession from a TV streaming app, and a
#     true device reboot) remains HUMAN / PHYSICAL REQUIRED and is reported as such below.
# If/when an official API-35 Android TV system image becomes available, switch the
# `system-image-*` inputs below to the TV variant and rename the job accordingly.
#
# The script steps below NEVER print "PASS" for a check they did not actually perform. Any
# item that cannot be honestly observed in a headless CI emulator emits an explicit
# "HUMAN/PHYSICAL REQUIRED" notice instead of a fake pass.

name: Android 15 (API 35) platform smoke (NOT Android TV)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  APP_ID: com.scenevibe.tvcompanionpoc
  # API 35 standard image. google_apis x86_64 is the broadly available Android 15 image; there
  # is no usable android-tv image at this API level (see header), so this is a platform-only
  # qualification.
  API_LEVEL: "35"
  EMU_TARGET: google_apis
  EMU_ARCH: x86_64

jobs:
  # Job name deliberately states the platform-only scope so a green check is never mistaken for
  # an Android TV qualification.
  android15-platform-smoke:
    name: Android 15 API 35 platform invariants (standard image, NOT Android TV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Cloud-mode debug APK for install
        env:
          # Stable public SceneVibe origin (NOT a secret): builds the installable APK against
          # the real Cloud endpoint, matching the Cloud qualification APK from android-debug.yml.
          SCENEVIBE_CLOUD_ORIGIN: https://interface-scenevibe-3wxg.vercel.app
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 (API 35) emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # Headless, no window, no audio/boot animation: this is a server CI runner.
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -u
            APP_ID="com.scenevibe.tvcompanionpoc"
            APK="app/build/outputs/apk/debug/app-debug.apk"
            FAILED=0

            note_human() {
              # Emit an explicit HUMAN/PHYSICAL REQUIRED notice. This is NOT a pass and NOT a
              # failure: it records that the check cannot be honestly qualified headlessly.
              echo "::notice title=HUMAN/PHYSICAL REQUIRED::$1"
              echo "HUMAN/PHYSICAL REQUIRED: $1"
            }
            fail() {
              echo "::error::$1"
              echo "FAIL: $1"
              FAILED=1
            }
            ok() {
              echo "PASS: $1"
            }

            echo "===== Android 15 (API 35) platform smoke — scope: platform invariants only ====="
            echo "----- device under test -----"
            adb shell getprop ro.build.version.sdk
            adb shell getprop ro.build.version.release
            adb shell getprop ro.product.cpu.abi
            # Honestly record that this standard image is NOT a leanback / Android TV device.
            LEANBACK="$(adb shell pm list features | grep -c 'android.software.leanback' || true)"
            if [ "$LEANBACK" = "0" ]; then
              note_human "Running on a STANDARD Android 15 image (no android.software.leanback). Android-TV leanback launcher, D-pad focus and TV overlay rendering are NOT qualified here; qualify on physical Android TV hardware."
            else
              echo "Device reports leanback feature (unexpected for the standard image)."
            fi

            echo "----- 1) APK present -----"
            if [ -f "$APK" ]; then ok "Cloud-mode debug APK was built at $APK"; else fail "APK not found at $APK"; fi

            echo "----- 2) adb install -----"
            if adb install -r "$APK"; then ok "APK installed"; else fail "adb install failed"; fi

            echo "----- 3) package present (pm list packages) -----"
            if adb shell pm list packages | tr -d '\r' | grep -q "package:${APP_ID}"; then
              ok "package ${APP_ID} present after install"
            else
              fail "package ${APP_ID} not present after install"
            fi

            echo "----- 4) clear logcat, then launch MainActivity -----"
            adb logcat -c || true
            # Launch the leanback launcher entry point explicitly.
            adb shell am start -n "${APP_ID}/.MainActivity"
            # Give the activity a moment to start / crash.
            sleep 8

            echo "----- 5) no immediate crash: scan logcat for AndroidRuntime FATAL EXCEPTION -----"
            LOG="$(adb logcat -d || true)"
            echo "$LOG" | grep -E 'FATAL EXCEPTION|AndroidRuntime' | grep -i "${APP_ID}" || true
            if echo "$LOG" | grep -E 'FATAL EXCEPTION' | grep -qi "${APP_ID}"; then
              fail "AndroidRuntime FATAL EXCEPTION detected for ${APP_ID} after launch"
            elif echo "$LOG" | grep -q 'FATAL EXCEPTION'; then
              # A fatal from another process is suspicious but not necessarily ours; surface it
              # as a notice rather than silently passing.
              note_human "A FATAL EXCEPTION appeared in logcat but not clearly attributed to ${APP_ID}; inspect the uploaded logcat to confirm it is unrelated."
              ok "no FATAL EXCEPTION attributed to ${APP_ID}"
            else
              ok "no FATAL EXCEPTION / AndroidRuntime crash after MainActivity launch"
            fi

            echo "----- 6) MainActivity resumed (dumpsys activity activities) -----"
            ACT="$(adb shell dumpsys activity activities || true)"
            if echo "$ACT" | grep -q "${APP_ID}/.MainActivity"; then
              if echo "$ACT" | grep -E 'mResumedActivity|ResumedActivity|topResumedActivity' | grep -q "${APP_ID}/.MainActivity"; then
                ok "MainActivity is the resumed/top activity"
              else
                # It is in the stack but resumed-state line not matched: do not fake a pass.
                note_human "MainActivity is present in the activity stack but the resumed-activity line could not be confirmed headlessly; confirm foreground resume on physical hardware."
              fi
            else
              fail "MainActivity not found in the activity stack after launch"
            fi

            echo "----- 7) foreground service (OverlayService, specialUse FGS) -----"
            # The OverlayService is a user-started specialUse FGS that REQUIRES Settings.canDrawOverlays
            # and is started only from an explicit on-screen user action in MainActivity. There is no
            # headless, honest way to (a) grant SYSTEM_ALERT_WINDOW such that Settings.canDrawOverlays
            # returns true on this image, (b) press the on-screen "Start SceneVibe" button via D-pad,
            # and (c) observe a real overlay window render. We attempt the grant for completeness but
            # we DO NOT assert the FGS is alive, because we cannot honestly observe it here.
            adb shell appops set "${APP_ID}" SYSTEM_ALERT_WINDOW allow || true
            echo "appops SYSTEM_ALERT_WINDOW state:"
            adb shell appops get "${APP_ID}" SYSTEM_ALERT_WINDOW || true
            note_human "OverlayService (specialUse foreground service) start + 'FGS alive' + overlay-window-visible require a real user action (D-pad 'Start SceneVibe') and a visible overlay surface. These are NOT honestly observable in this headless CI emulator and are HUMAN/PHYSICAL REQUIRED on Android TV hardware."

            echo "----- 8) boot / autostart path (BootReceiver -> specialUse FGS) -----"
            # The BOOT_COMPLETED autostart path depends on an opt-in (default OFF), on
            # Settings.canDrawOverlays, on NotificationListener access, and on a real device
            # reboot delivering BOOT_COMPLETED. A headless `adb reboot` of a CI emulator does not
            # faithfully reproduce TV boot ordering or the opt-in/permission preconditions, so we
            # do NOT fake a boot-path pass. We only confirm the installed package survives a
            # process-level restart as a weak lower bound, and mark the real boot path as human.
            note_human "BOOT_COMPLETED autostart (BootReceiver arming the specialUse FGS in boot-prepare mode) requires the autostart opt-in ON, overlay + MediaSession access granted, and a genuine device reboot. This is NOT honestly qualifiable headlessly and is HUMAN/PHYSICAL REQUIRED on Android TV hardware."
            # Weak, honest lower bound only: package must still be installed after force-stop.
            adb shell am force-stop "${APP_ID}" || true
            if adb shell pm list packages | tr -d '\r' | grep -q "package:${APP_ID}"; then
              ok "package ${APP_ID} still present after force-stop (install persistence lower bound; NOT a boot-path qualification)"
            else
              fail "package ${APP_ID} missing after force-stop"
            fi

            echo "----- summary -----"
            echo "Qualified here (Android 15 / API 35 platform invariants): APK build+install, package presence, MainActivity launch, no AndroidRuntime fatal, activity-stack presence."
            echo "HUMAN/PHYSICAL REQUIRED (not qualified here): Android TV leanback runtime, overlay FGS alive + visible, real BOOT_COMPLETED autostart, true device reboot."

            if [ "$FAILED" -ne 0 ]; then
              echo "::error::Android 15 platform smoke test FAILED (see FAIL lines above)."
              exit 1
            fi
            echo "Android 15 (API 35) platform smoke test: all performed checks passed; unqualifiable items marked HUMAN/PHYSICAL REQUIRED."

      - name: Collect logcat artifact note
        if: always()
        run: echo "Logcat was scanned inline in the emulator step; see the step log for AndroidRuntime scan output."
