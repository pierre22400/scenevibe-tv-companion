name: Android release APK (stable-signed)

# Dedicated RELEASE chain, intentionally SEPARATE from android-debug.yml.
#
# This workflow is manual-only (workflow_dispatch). It builds the Consumer Cloud Mode
# release variant (SCENEVIBE_ENABLE_LAN_DEV=false, the real public SceneVibe origin),
# runs assembleRelease to emit the UNSIGNED non-debuggable release APK, then signs it
# with apksigner using the four stable-signing GitHub repository secrets.
#
# CRITICAL DIFFERENCE from android-debug.yml: the debug workflow treats signing as an
# OPTIONAL, secret-gated add-on (it soft-passes unsigned when secrets are absent). A
# RELEASE must never be produced unsigned, so this workflow FAILS FAST and EXPLICITLY
# (::error:: + exit 1) when any of the four signing secrets is missing.
#
# This workflow does NOT publish to Play Store, does NOT push a tag, and does NOT
# create a GitHub release. It only produces a signed APK + verification artifacts.
# No keystore, private key, password, or Base64 key material is ever committed, echoed,
# logged, or uploaded: the keystore is decoded into RUNNER_TEMP at runtime and discarded
# in an always() step with the runner.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # `secrets` is not available in step-level `if:` expressions, so expose the
      # "are ALL FOUR stable-signing secrets configured" boolean as a job-level env var
      # (same safe pattern as android-debug.yml). Only the boolean result is surfaced;
      # no secret value is ever exposed. The explicit gate step below turns a missing/
      # partial secret set into a hard failure for the release chain.
      SIGNING_ENABLED: ${{ secrets.SCENEVIBE_ANDROID_KEYSTORE_BASE64 != '' && secrets.SCENEVIBE_ANDROID_KEYSTORE_PASSWORD != '' && secrets.SCENEVIBE_ANDROID_KEY_ALIAS != '' && secrets.SCENEVIBE_ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Match android-debug.yml. assembleRelease runs lintVital, which only works
          # under gradle 8.9 (it crashes under newer gradle), so pin 8.9 here too.
          gradle-version: "8.9"
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Fail-fast release gate: this MUST run before any build so a release can never
      # be produced unsigned. Unlike the debug workflow, missing secrets are a hard stop.
      - name: Require all four stable-signing secrets (release must never ship unsigned)
        run: |
          if [ "$SIGNING_ENABLED" != "true" ]; then
            echo '::error::Release signing secrets are not configured. All four of SCENEVIBE_ANDROID_KEYSTORE_BASE64 / _KEYSTORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD must be set as GitHub repository secrets. Unlike the debug workflow, a release MUST NOT be produced unsigned.'
            exit 1
          fi

      # Preserve the existing quality gates so a release never ships from a red tree.
      - name: Check POC boundary
        run: python3 -m unittest discover -s tests
      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Consumer Cloud Mode release APK (unsigned, non-debuggable)
        env:
          # Consumer Cloud Mode: NOT a developer LAN build. These are NOT secrets.
          SCENEVIBE_ENABLE_LAN_DEV: "false"
          # Stable public SceneVibe origin (NOT a secret).
          SCENEVIBE_CLOUD_ORIGIN: https://interface-scenevibe-3wxg.vercel.app
        run: gradle :app:assembleRelease --stacktrace

      - name: Validate release APK is NOT debuggable
        run: |
          # Fail CLOSED: this gate must prove the shipped artifact is non-debuggable,
          # so every way the check could silently no-op is turned into a hard failure.
          # set -euo pipefail stops the step on any unset var or failed command; the
          # explicit APK-exists and non-empty-badging assertions prove aapt actually
          # ran and produced output BEFORE we grep for the debuggable flag (otherwise a
          # failed aapt would feed empty input to grep, grep would find nothing, and the
          # old pipeline would have falsely reported "NON-DEBUGGABLE OK").
          set -euo pipefail
          BUILD_TOOLS_DIR="$(ls -d "$ANDROID_HOME"/build-tools/35.0.0)"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "::error::Unsigned release APK not found at $UNSIGNED_APK. assembleRelease did not produce the expected artifact."
            exit 1
          fi
          BADGING="$("$AAPT" dump badging "$UNSIGNED_APK")"
          if [ -z "$BADGING" ]; then
            echo "::error::aapt dump badging produced no output for $UNSIGNED_APK. Cannot validate the debuggable flag; failing closed."
            exit 1
          fi
          if echo "$BADGING" | grep -q 'application-debuggable'; then
            echo '::error::Release APK is debuggable. assembleRelease must emit a non-debuggable APK.'
            exit 1
          fi
          echo "NON-DEBUGGABLE OK"

      - name: Decode stable signing keystore into RUNNER_TEMP
        id: stable_keystore
        env:
          SCENEVIBE_ANDROID_KEYSTORE_BASE64: ${{ secrets.SCENEVIBE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/scenevibe-stable.jks"
          printf '%s' "$SCENEVIBE_ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Sign release APK with stable key and verify certs
        id: stable_sign
        env:
          SCENEVIBE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SCENEVIBE_ANDROID_KEYSTORE_PASSWORD }}
          SCENEVIBE_ANDROID_KEY_ALIAS: ${{ secrets.SCENEVIBE_ANDROID_KEY_ALIAS }}
          SCENEVIBE_ANDROID_KEY_PASSWORD: ${{ secrets.SCENEVIBE_ANDROID_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ steps.stable_keystore.outputs.keystore_path }}
        run: |
          BUILD_TOOLS_DIR="$(ls -d "$ANDROID_HOME"/build-tools/35.0.0)"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="$RUNNER_TEMP/scenevibe-tv-companion-release.apk"
          cp "$UNSIGNED_APK" "$SIGNED_APK"
          # Password and alias are passed by env: reference, never inline on the command line.
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "env:SCENEVIBE_ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$SCENEVIBE_ANDROID_KEY_ALIAS" \
            --key-pass "env:SCENEVIBE_ANDROID_KEY_PASSWORD" \
            "$SIGNED_APK"
          # apksigner's sign step aligns the archive; verify + capture the certs output.
          "$APKSIGNER" verify --print-certs "$SIGNED_APK" | tee "$RUNNER_TEMP/release-apksigner-verify.txt"
          echo "signed_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Assemble secret-free release artifacts and metadata
        id: stage
        env:
          SIGNED_APK: ${{ steps.stable_sign.outputs.signed_apk }}
          SCENEVIBE_CLOUD_ORIGIN: https://interface-scenevibe-3wxg.vercel.app
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(ls -d "$ANDROID_HOME"/build-tools/35.0.0)"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          STAGE="$RUNNER_TEMP/release-artifacts"
          mkdir -p "$STAGE"

          # (1) signed APK
          cp "$SIGNED_APK" "$STAGE/scenevibe-tv-companion-release.apk"
          # (2) apksigner verify --print-certs output
          cp "$RUNNER_TEMP/release-apksigner-verify.txt" "$STAGE/release-apksigner-verify.txt"

          # (3) APK SHA-256
          APK_SHA256="$(sha256sum "$STAGE/scenevibe-tv-companion-release.apk" | awk '{print $1}')"
          echo "$APK_SHA256  scenevibe-tv-companion-release.apk" > "$STAGE/apk-sha256.txt"

          # (4) certificate SHA-256 fingerprint, extracted from the verify output.
          # NOTE: this matches the literal label "certificate SHA-256 digest:" emitted
          # by apksigner from build-tools 35.0.0 (the version pinned above via
          # sdkmanager "build-tools;35.0.0"). If a future build-tools version changes
          # that wording, this extraction would yield an empty digest, which the
          # hard-fail below catches, so the step fails loudly rather than shipping an
          # empty certificateSha256. Re-confirm the label if the pinned version changes.
          CERT_SHA256="$(grep -i 'certificate SHA-256 digest:' "$STAGE/release-apksigner-verify.txt" | head -n1 | sed 's/.*digest:[[:space:]]*//' | tr -d '[:space:]')"
          if [ -z "$CERT_SHA256" ]; then
            echo '::error::Could not extract certificate SHA-256 digest from apksigner verify output.'
            exit 1
          fi
          echo "$CERT_SHA256" > "$STAGE/cert-sha256.txt"

          # Pull version/application identifiers from the APK via aapt (do NOT hardcode).
          BADGING="$("$AAPT" dump badging "$STAGE/scenevibe-tv-companion-release.apk")"
          APPLICATION_ID="$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(echo "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(echo "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"

          # (5) secret-free metadata JSON with EXACTLY the required fields.
          COMMIT_SHA='${{ github.sha }}'
          printf '{\n  "versionName": "%s",\n  "versionCode": "%s",\n  "applicationId": "%s",\n  "commitSha": "%s",\n  "apkSha256": "%s",\n  "certificateSha256": "%s",\n  "cloudOrigin": "%s",\n  "targetSdk": "35",\n  "compileSdk": "35"\n}\n' \
            "$VERSION_NAME" "$VERSION_CODE" "$APPLICATION_ID" "$COMMIT_SHA" "$APK_SHA256" "$CERT_SHA256" "$SCENEVIBE_CLOUD_ORIGIN" \
            > "$STAGE/release-metadata.json"

          # Defensive assertion: metadata must never contain secret material.
          if grep -Eiq 'password|keystore|base64|ks-pass|key-pass|-----BEGIN' "$STAGE/release-metadata.json"; then
            echo '::error::release-metadata.json appears to contain secret material. Refusing to proceed.'
            exit 1
          fi

          echo "stage_dir=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: scenevibe-tv-companion-release
          path: ${{ steps.stage.outputs.stage_dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Discard decoded keystore and staged signed APK
        if: ${{ always() }}
        env:
          KEYSTORE_PATH: ${{ steps.stable_keystore.outputs.keystore_path }}
        run: |
          rm -f "$KEYSTORE_PATH" "$RUNNER_TEMP/scenevibe-tv-companion-release.apk"
