name: Public Viewer 001-C Android
on:
  push:
    branches: [work/scenevibe-public-viewer-dpad-audit]
    paths: ['app/**', '.github/scripts/public-viewer-001c-*', '.github/workflows/public-viewer-001c-android.yml']
permissions:
  contents: read
env:
  ORG_GRADLE_PROJECT_scenevibeRealTrack001: 'true'
  ORG_GRADLE_PROJECT_scenevibeAutonomousHosted001d: 'true'
  ORG_GRADLE_PROJECT_scenevibeCompanionMute002: 'true'
  ORG_GRADLE_PROJECT_scenevibePublicViewer001: 'true'
  ORG_GRADLE_PROJECT_scenevibeHistoricalViewer001c: 'true'
  SCENEVIBE_CLOUD_ORIGIN: https://scenevibe-public-viewer001c-qual.vercel.app
  SCENEVIBE_PUBLIC_VIEWER_ORIGIN: https://scenevibe-public-viewer001-qual.vercel.app
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile the 001-C Android service and run its focused regressions
        run: gradle --no-daemon --max-workers=2 testTvux002UnitTest --tests '*PublicViewerPreferencesTest' --tests '*PublicCatalogueCandidateTest' --tests '*CompanionShortcutServiceTest' --tests '*CompanionRecalibrationPanelTest' --tests '*HistoricalViewerTransportTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-viewer-001c-android-regressions
          path: app/build/test-results/testTvux002UnitTest/*.xml

  test-a:
    if: contains(github.event.head_commit.message, '[test-a]')
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble the unsigned-source debug qualification pair
        run: gradle --no-daemon --max-workers=2 -PscenevibeTvUx002NativeQualification=true assembleTvux002 assembleTvux002AndroidTest
      - name: Prepare Chromium and KVM
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/001c-browser" --no-package-lock --ignore-scripts playwright@1.62.1
          echo "SCENEVIBE_PLAYWRIGHT_MODULE=$RUNNER_TEMP/001c-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "SCENEVIBE_CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          profile: tv_1080p
          arch: x86
          disk-size: 2048M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048 -cores 2
          script: bash .github/scripts/public-viewer-001c-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-viewer-001c-test-a
          path: viewer001c-evidence/

  media-coexistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SCENEVIBE_CLOUD_ORIGIN: ''
      ORG_GRADLE_PROJECT_scenevibeHistoricalViewer001c: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble Android MEDIA qualification
        run: gradle --no-daemon --max-workers=2 -PscenevibeTvUx002NativeQualification=true assembleTvux002 assembleTvux002AndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          profile: tv_1080p
          arch: x86
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048 -cores 2
          script: bash .github/scripts/public-viewer-001c-coexistence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-viewer-001c-coexistence
          path: viewer001c-coexistence/
