name: E5 WORK 037 stable signing qualification only

on:
  push:
    branches: [qualification/scenevibe-e5-stable-work-037]
    paths:
      - .github/workflows/e5-work-037-stable-signing.yml
      - qualification/e5-work037/verify_apk.py

permissions:
  contents: read
  actions: read

concurrency:
  group: e5-work-037-stable-signing
  cancel-in-progress: false

jobs:
  sign-exact-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Only a presence boolean is exposed globally. Key and passwords are confined
      # to the same isolated decode/sign mechanism already used by android-debug.yml.
      SIGNING_ENABLED: ${{ secrets.SCENEVIBE_ANDROID_KEYSTORE_BASE64 != '' && secrets.SCENEVIBE_ANDROID_KEYSTORE_PASSWORD != '' && secrets.SCENEVIBE_ANDROID_KEY_ALIAS != '' && secrets.SCENEVIBE_ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Require existing stable signing configuration
        run: |
          set -euo pipefail
          test "$SIGNING_ENABLED" = true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install signature and identity verification tools only
        run: sdkmanager "build-tools;35.0.0"
      - name: Download immutable source artifact and verify both hashes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 qualification/e5-work037/verify_apk.py download "$RUNNER_TEMP/e5-work037"
      - name: Verify source signature, package, compiled flags and fixture
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/e5-work037"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$EVIDENCE/source.apk" | tee "$EVIDENCE/source-signature.txt"
          python3 qualification/e5-work037/verify_apk.py inspect "$EVIDENCE/source.apk" "$TOOLS/aapt" "$EVIDENCE/source-evidence.json" source
          chmod a-w "$EVIDENCE/source.apk"
      - name: Decode existing stable keystore into RUNNER_TEMP
        env:
          SCENEVIBE_ANDROID_KEYSTORE_BASE64: ${{ secrets.SCENEVIBE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SCENEVIBE_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/scenevibe-stable.jks"
      - name: Sign a distinct copy using the existing stable mechanism
        env:
          SCENEVIBE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SCENEVIBE_ANDROID_KEYSTORE_PASSWORD }}
          SCENEVIBE_ANDROID_KEY_ALIAS: ${{ secrets.SCENEVIBE_ANDROID_KEY_ALIAS }}
          SCENEVIBE_ANDROID_KEY_PASSWORD: ${{ secrets.SCENEVIBE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/e5-work037"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          SIGNED_APK="$EVIDENCE/SceneVibe_E5_47f675db_stable.apk"
          cp "$EVIDENCE/source.apk" "$SIGNED_APK"
          chmod u+w "$SIGNED_APK"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/scenevibe-stable.jks" \
            --ks-pass "env:SCENEVIBE_ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$SCENEVIBE_ANDROID_KEY_ALIAS" \
            --key-pass "env:SCENEVIBE_ANDROID_KEY_PASSWORD" \
            "$SIGNED_APK"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK" | tee "$EVIDENCE/stable-signature.txt"
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 31 --max-sdk-version 31 "$SIGNED_APK" | tee "$EVIDENCE/stable-signature-api31.txt"
      - name: Enforce expected certificate, source preservation and exact payload equality
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/e5-work037"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          python3 qualification/e5-work037/verify_apk.py inspect "$EVIDENCE/source.apk" "$AAPT" "$EVIDENCE/source-evidence.json" source
          python3 qualification/e5-work037/verify_apk.py inspect "$EVIDENCE/SceneVibe_E5_47f675db_stable.apk" "$AAPT" "$EVIDENCE/signed-evidence.json"
          python3 qualification/e5-work037/verify_apk.py compare "$EVIDENCE/source-evidence.json" "$EVIDENCE/signed-evidence.json" "$EVIDENCE/stable-signature.txt" "$EVIDENCE/qualification-proof.json"
          sha256sum "$EVIDENCE/SceneVibe_E5_47f675db_stable.apk" | sed "s|$EVIDENCE/||" > "$EVIDENCE/SHA256SUMS.txt"
          printf '%s\n' "### E5 WORK 037 — stable copy verified" 'No Sony access, no installation, no application build, no release.' >> "$GITHUB_STEP_SUMMARY"
          cat "$EVIDENCE/SHA256SUMS.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload qualification APK and public verification evidence only
        uses: actions/upload-artifact@v4
        with:
          name: scenevibe-e5-work037-stable-qualification
          path: |
            ${{ runner.temp }}/e5-work037/SceneVibe_E5_47f675db_stable.apk
            ${{ runner.temp }}/e5-work037/SHA256SUMS.txt
            ${{ runner.temp }}/e5-work037/source-evidence.json
            ${{ runner.temp }}/e5-work037/signed-evidence.json
            ${{ runner.temp }}/e5-work037/qualification-proof.json
            ${{ runner.temp }}/e5-work037/source-signature.txt
            ${{ runner.temp }}/e5-work037/stable-signature.txt
            ${{ runner.temp }}/e5-work037/stable-signature-api31.txt
          if-no-files-found: error
          retention-days: 30
      - name: Discard keystore and runner-local APKs even on refusal
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/scenevibe-stable.jks"
          rm -rf "$RUNNER_TEMP/e5-work037"
