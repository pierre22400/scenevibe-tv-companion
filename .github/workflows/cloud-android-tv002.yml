name: Cloud Android TV 002 experimental service
on:
  push:
    branches: [work/scenevibe-cloud-android-tv-002]
    paths: [app/**, docs/cloud-android-tv002.md, .github/workflows/cloud-android-tv002.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SCENEVIBE_CLOUD_ORIGIN: https://scenevibe-cloud-tv002-staging-archc-ode.vercel.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Regress historical runtime and TEXT service
        env:
          SCENEVIBE_CLOUD_ORIGIN: ''
        run: |
          gradle --no-daemon --max-workers=2 testDebugUnitTest
          gradle --no-daemon --max-workers=2 testTvfirst008UnitTest --tests '*TvFirst008BoundaryTest' --tests '*TvFirst008CacheTest' --tests '*TvFirst008HttpTest' --tests '*TvFirst008IdentityTest' --tests '*TvFirst009ClosedBoundaryTest'
          gradle --no-daemon --max-workers=2 testTvfirst009UnitTest testTvfirst009sonyUnitTest
      - name: Compile experimental service, native tests and historical candidate
        run: |
          gradle --no-daemon --max-workers=2 assembleCloudandroid002 lintCloudandroid002 assembleTvfirst013sony
          gradle --no-daemon --max-workers=2 -PscenevibeCloudAndroid002NativeQualification=true assembleCloudandroid002AndroidTest
      - name: Rebuild unsigned candidate after native test compilation
        run: |
          gradle --no-daemon --max-workers=2 assembleCloudandroid002
          sha256sum app/build/outputs/apk/cloudandroid002/*unsigned.apk > cloud-android-tv002-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scenevibe-cloud-android-tv002-${{ github.run_id }}
          path: |
            app/build/outputs/apk/cloudandroid002/*unsigned.apk
            cloud-android-tv002-sha256.txt
            app/build/test-results/**/*.xml
            app/build/reports/lint-results-cloudandroid002.*
          if-no-files-found: error
          retention-days: 14
