# E5-NATIVE-035 isolated software proof. No Cloud origin, signing secret or physical target.
# API31/35 are standard emulators; native transport is SIMULATED, player/host are actual.
name: E5 native 035 isolated software
on:
  push:
    branches: [work/scenevibe-e5-native-l0-l1-035]
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/scripts/e5-native-035*'
      - '.github/workflows/e5-native-035-software.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install build SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - name: Baseline from exact immutable M5 source
        run: |
          mkdir -p "$RUNNER_TEMP/e5-base"
          git archive 17cbe36ae99ac7f48aaf861e0d1feac702a9e521 | tar -x -C "$RUNNER_TEMP/e5-base"
          cd "$RUNNER_TEMP/e5-base"
          python3 -m unittest discover -s tests
          gradle :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --console=plain
      - name: Actual candidate and retained historical source scopes
        run: |
          python3 -m unittest discover -s tests
          gradle :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease :app:testDebugUnitTest --console=plain
      - name: Snapshot default-OFF evidence
        run: |
          mkdir -p "$RUNNER_TEMP/e5-evidence/default"
          cp -r app/build/test-results "$RUNNER_TEMP/e5-evidence/default/"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/e5-evidence/default/"
          cp app/build/reports/lint-results-debug.xml "$RUNNER_TEMP/e5-evidence/default/"
      - name: Build explicit local qualification candidate
        env:
          SCENEVIBE_E5_NATIVE_QUALIFICATION: e5-native-035
        run: |
          # Variant assets differ with this explicit token; rebuild after preserving OFF evidence.
          gradle :app:clean --console=plain
          gradle --init-script .github/scripts/e5-native-035.init.gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:testDebugUnitTest --console=plain
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload candidate software evidence and APK
        uses: actions/upload-artifact@v4
        with:
          name: e5-native-035-software-and-local-candidate
          path: |
            app/build/test-results
            app/build/reports/lint-results-*.xml
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            ${{ runner.temp }}/e5-evidence
          retention-days: 30
  platform:
    needs: software
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - name: Build offline qualification instrumentation
        env:
          SCENEVIBE_E5_NATIVE_QUALIFICATION: e5-native-035
        run: gradle --init-script .github/scripts/e5-native-035.init.gradle :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Enable KVM on disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvmall.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android player/host; simulated native session; NOT Sony
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash .github/scripts/e5-native-035-platform.sh
      - name: Upload actual platform observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-native-035-platform-api-${{ matrix.api }}
          path: e5-platform-results
          if-no-files-found: warn
          retention-days: 30
