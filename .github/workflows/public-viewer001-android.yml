name: PUBLIC VIEWER E2E 001 - Android candidate
on:
  push:
    branches: [work/scenevibe-public-viewer-e2e-001-tv]
    paths-ignore: ['docs/**']
permissions:
  contents: read
concurrency:
  group: public-viewer001-android
  cancel-in-progress: true
env:
  ORG_GRADLE_PROJECT_scenevibeRealTrack001: 'true'
  ORG_GRADLE_PROJECT_scenevibeAutonomousHosted001d: 'true'
  ORG_GRADLE_PROJECT_scenevibeCompanionMute002: 'true'
  ORG_GRADLE_PROJECT_scenevibePublicViewer001: 'true'
  SCENEVIBE_CLOUD_ORIGIN: https://scenevibe-autonomous001d-qual-preview.vercel.app
  SCENEVIBE_PUBLIC_VIEWER_ORIGIN: https://scenevibe-public-viewer001-qual.vercel.app
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify preferences, public cache and MUTE regressions
        run: gradle --no-daemon --max-workers=2 testTvux002UnitTest --tests '*PublicViewerPreferencesTest' --tests '*PublicCatalogueCandidateTest' --tests '*CompanionShortcutServiceTest' --tests '*CompanionRecalibrationPanelTest'
      - name: Assemble the separate v34 candidate
        run: gradle --no-daemon --max-workers=2 assembleTvux002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-viewer001-candidate-unsigned-${{ github.sha }}
          path: |
            app/build/outputs/apk/tvux002/*.apk
            app/build/test-results/**/*.xml
          if-no-files-found: error
          retention-days: 14
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile the native HTTPS qualification APK
        run: gradle --no-daemon --max-workers=2 -PscenevibeTvUx002NativeQualification=true assembleTvux002 assembleTvux002AndroidTest
      - name: Wait for the Track made by the Studio qualification
        run: |
          node --input-type=module <<'JS'
          import { appendFile } from 'node:fs/promises'
          for (let i = 0; i < 108; i++) {
            const response = await fetch(process.env.SCENEVIBE_PUBLIC_VIEWER_ORIGIN + '/api/public/catalogue/tracks?limit=100').catch(()=>null)
            if (response?.ok) {
              const { items } = await response.json()
              const track = items.find(row => row.track.title.startsWith('Qualification spectateur 001 — Columbo — Eaux troubles — ')
                && row.multimedia?.textCount >= 4 && row.multimedia?.audioCount === 3)
              if (track) {
                await appendFile(process.env.GITHUB_ENV, 'SCENEVIBE_VIEWER_TRACK_ID=' + track.identity.trackId + '\n')
                process.exit(0)
              }
            }
            await new Promise(resolve => setTimeout(resolve, 10000))
          }
          throw new Error('PUBLISHED_STUDIO_TRACK_UNAVAILABLE')
          JS
      - name: Enable acceleration on the owned emulator runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          profile: tv_1080p
          arch: x86
          disk-size: 2048M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048 -cores 2
          script: bash .github/scripts/public-viewer001-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-viewer001-android-native-${{ github.sha }}
          path: public-viewer-native/
          if-no-files-found: warn
          retention-days: 14
