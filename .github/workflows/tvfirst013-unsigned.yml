name: TV-FIRST 013 unsigned Sony APK preparation
on:
  push:
    branches:
      - work/scenevibe-tv-first-013-apk-preparation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build unsigned v15 candidate
        env:
          SCENEVIBE_CLOUD_ORIGIN: https://scenevibe-tvfirst008-qualification.vercel.app
          SCENEVIBE_ENABLE_LAN_DEV: 'false'
        run: gradle :app:assembleTvfirst013sony --stacktrace
      - name: Verify candidate identity and version
        run: |
          APK=$(find app/build/outputs/apk/tvfirst013sony -name '*.apk' -type f | head -1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.scenevibe.tvcompanionpoc' versionCode='15'"
          sha256sum "$APK" | tee candidate-sha256.txt
      - name: Upload unsigned candidate only
        uses: actions/upload-artifact@v4
        with:
          name: scenevibe-tvfirst013-unsigned-v15
          path: |
            app/build/outputs/apk/tvfirst013sony/*.apk
            candidate-sha256.txt
          if-no-files-found: error
          retention-days: 7
