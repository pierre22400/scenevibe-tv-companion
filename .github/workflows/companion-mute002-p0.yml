name: COMPANION MUTE 002 P0 actual Android shortcut
on:
  push:
    branches: [work/scenevibe-companion-mute-integration-002]
    paths-ignore: ["docs/**"]
permissions:
  contents: read
env:
  ORG_GRADLE_PROJECT_scenevibeRealTrack001: 'true'
  ORG_GRADLE_PROJECT_scenevibePublicAutonomous001b: 'true'
  ORG_GRADLE_PROJECT_scenevibeAutonomousHosted001d: 'true'
  ORG_GRADLE_PROJECT_scenevibeCompanionMute002: 'true'
  SCENEVIBE_CLOUD_ORIGIN: ''
jobs:
  shortcut:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Synthetic callbacks and actual compiled manifest
        run: gradle --no-daemon --max-workers=2 testTvux002UnitTest --tests '*CompanionShortcutServiceTest'
      - name: Compile native system-shortcut fixture
        run: gradle --no-daemon --max-workers=2 -PscenevibeTvUx002NativeQualification=true assembleTvux002 assembleTvux002AndroidTest
      - name: Owned emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android binding and system callback, no Track or Sony
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          profile: tv_1080p
          arch: x86
          disk-size: 2048M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048 -cores 2
          script: bash .github/scripts/companion-mute002-p0.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scenevibe-mute002-p0-${{ github.run_id }}
          path: |
            mute002-p0/
            app/build/test-results/**/*.xml
          if-no-files-found: error
          retention-days: 14
