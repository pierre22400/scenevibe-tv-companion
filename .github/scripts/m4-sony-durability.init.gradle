/**
 * Compile the same M4 runner against the pinned pre-fix tree and current source.
 * Exclude unrelated modern fixtures from that old dependency graph. Finalize the
 * test DSL after the application default runner; keep production inputs intact.
 */
gradle.beforeProject { project ->
    if (project.path == ":app") {
        project.plugins.withId("com.android.application") {
            project.androidComponents.finalizeDsl { android ->
                def fixtureRoot = System.getenv("SCENEVIBE_DURABILITY_TEST_ROOT") ?: project.rootDir.toString()
                android.defaultConfig.testInstrumentationRunner =
                    "com.scenevibe.tvcompanionpoc.M4SonyDurabilityInstrumentation"
                android.sourceSets.androidTest.java.srcDirs =
                    [new File(fixtureRoot, "app/src/androidTest/java")]
                android.sourceSets.androidTest.java.setIncludes(["**/M4SonyDurabilityInstrumentation.java"])
                android.sourceSets.androidTest.assets.srcDirs =
                    [new File(fixtureRoot, "app/src/test/resources/m4")]
            }
        }
    }
}
