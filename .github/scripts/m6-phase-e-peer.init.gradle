import groovy.json.JsonOutput
import java.security.MessageDigest

/**
 * Export the actual executed JVM classpath for the disposable Cloud HTTP peer.
 * This contains public test dependencies and compiled test/application classes,
 * never a keystore, device identity, credential or Sony installation snapshot.
 */
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(":app")
    app.tasks.register("m6PackagePeerArtifact") {
        dependsOn app.tasks.named("testDebugUnitTest")
        doLast {
            def destination = new File(app.buildDir, "reports/m6-phase-e-peer")
            destination.mkdirs()
            def jars = []
            app.tasks.named("testDebugUnitTest").get().classpath.files.eachWithIndex { input, index ->
                def name = "classpath-${index}.jar"
                def output = new File(destination, name)
                if (input.isDirectory()) {
                    ant.jar(destfile: output.absolutePath, basedir: input.absolutePath)
                } else if (input.name.endsWith(".jar")) {
                    output.bytes = input.bytes
                } else {
                    throw new GradleException("Unexpected JVM peer classpath entry")
                }
                jars.add([name: name, sha256: MessageDigest.getInstance("SHA-256").digest(output.bytes).encodeHex().toString()])
            }
            def head = ["git", "rev-parse", "HEAD"].execute(null, gradle.rootProject.projectDir).text.trim()
            new File(destination, "peer-metadata.json").text = JsonOutput.prettyPrint(JsonOutput.toJson([
                version: "scenevibe.m6.phase-e.http-peer.v1", tvHead: head,
                mainClass: "com.scenevibe.tvcompanionpoc.M6PhaseEHttpPeer", jars: jars,
                tls: "not-qualified-by-loopback", sony: false
            ])) + "\n"
        }
    }
}
