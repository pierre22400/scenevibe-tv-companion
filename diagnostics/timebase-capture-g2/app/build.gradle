plugins { id 'com.android.application' }
/** Platform-only private instrument. Test libraries are absent from the delivered application. */
android {
    namespace 'com.scenevibe.timebasecaptureg2'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField "String", "SOURCE_COMMIT", "\"${System.getenv('GITHUB_SHA') ?: 'LOCAL_UNQUALIFIED'}\""
        applicationId 'com.scenevibe.timebasecaptureg2'
        minSdk 31
        targetSdk 35
        versionCode 2
        versionName '0.0.2-g2-003a-private-diagnostic'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        debug { debuggable true }
        release { debuggable false; minifyEnabled false; signingConfig null }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError true; disable 'ObsoleteSdkInt', 'SetTextI18n', 'InlinedApi' }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
